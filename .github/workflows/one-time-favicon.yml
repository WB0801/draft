name: One-time favicon patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[favicon-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert favicon link
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          data = p.read_bytes()
          marker = '<title>猫和老鼠随机抽签器</title>'.encode('utf-8')
          tag = b'<link rel="icon" type="image/svg+xml" href="./favicon.svg">'
          if tag not in data:
              if marker not in data:
                  raise SystemExit('title marker not found')
              nl = b'\r\n' if b'\r\n' in data[:500] else b'\n'
              data = data.replace(marker, marker + nl + tag, 1)
              p.write_bytes(data)
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: wire custom favicon [favicon-patch]"
          git push
