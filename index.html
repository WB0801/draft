<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>猫和老鼠随机抽签器</title>
<style>
:root{
  --bg:#f5efe5;
  --paper:#fffdf8;
  --ink:#2e2b28;
  --muted:#756e67;
  --line:#e4d6c5;
  --blue:#2f86d8;
  --blue2:#1769aa;
  --green:#4ca957;
  --green2:#368842;
  --orange:#f1a23a;
  --red:#e35c50;
  --violet:#7568c9;
  --shadow:0 12px 34px rgba(72,49,29,.11);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.9),rgba(255,255,255,0) 28%),
    linear-gradient(180deg,#faf6ee 0%,#f1e8da 100%);
  padding:14px;
}
button,input{font:inherit}
button{user-select:none;-webkit-tap-highlight-color:transparent}
.app{width:min(980px,100%);margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 28px)}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:4px 2px}
.title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo-dot{width:15px;height:15px;border-radius:50%;background:var(--red);box-shadow:20px 0 0 #f2bf33,40px 0 0 var(--blue);margin-right:40px;flex:0 0 auto}
h1{font-size:clamp(23px,3vw,34px);margin:0;line-height:1.1;white-space:nowrap}
.subtitle{font-size:13px;color:var(--muted);margin-top:3px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mini-btn{border:1px solid var(--line);background:rgba(255,253,248,.92);color:#514941;padding:10px 13px;border-radius:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 9px rgba(74,51,30,.05)}
.mini-btn:active{transform:translateY(1px)}
.stage{position:relative;flex:1;min-height:480px;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:22px}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,rgba(255,255,255,.98),rgba(255,255,255,.67) 37%,rgba(255,248,236,.34) 67%,rgba(255,248,236,.12));pointer-events:none}
.main-art{position:absolute;inset:10px 8px 0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:0}
.main-art img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 10px 10px rgba(59,39,22,.05))}
.draw-art{position:absolute;right:18px;bottom:10px;width:min(280px,33%);opacity:0;transform:translateY(18px) scale(.96);transition:.22s ease;pointer-events:none;z-index:1}
.draw-art img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px rgba(60,40,20,.1))}
body.drawing-now .draw-art{opacity:.24;transform:translateY(0) scale(1)}
body.drawing-now .main-art{opacity:.78}
.result-reaction{position:absolute;right:3%;bottom:2%;width:118px;opacity:0;transform:translateY(15px) scale(.9);pointer-events:none;z-index:3;transition:.2s ease}
.result-reaction.show{opacity:.92;transform:translateY(0) scale(1)}
.result-reaction img{width:100%;display:block;filter:drop-shadow(0 7px 8px rgba(50,35,20,.12))}
.result-zone{position:relative;z-index:2;width:min(500px,64vw);min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 18px}
.result-kicker{font-weight:800;color:#6f665e;font-size:17px;letter-spacing:.5px;margin-bottom:4px}
#result{font-size:clamp(150px,30vw,330px);font-weight:900;color:var(--blue);line-height:.88;min-height:.9em;display:flex;align-items:center;justify-content:center;text-shadow:0 4px 0 rgba(255,255,255,.7),0 8px 18px rgba(35,107,166,.12)}
#result.empty-result{color:#b6b0aa}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1)}}
.result-note{min-height:26px;font-size:17px;color:#625b55;font-weight:700;margin-top:10px;background:rgba(255,253,248,.88);padding:4px 12px;border-radius:999px}
.bottom{display:grid;grid-template-columns:1fr;gap:10px}
#draw{border:none;width:100%;padding:20px 18px;border-radius:19px;color:#fff;font-size:clamp(25px,3vw,31px);font-weight:900;background:linear-gradient(180deg,#59bb64,#3b9146);box-shadow:0 8px 16px rgba(55,129,64,.18);cursor:pointer}
#draw:active{transform:scale(.995)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.action-btn{border:none;border-radius:15px;padding:14px 10px;color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 5px 11px rgba(55,40,25,.08)}
.action-btn:active{transform:translateY(1px)}
#undo{background:var(--orange)}
#historyBtn{background:var(--blue)}
#settingsBtn{background:var(--violet)}
#reset{background:var(--red)}
button:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.7)}
.status-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:#5f5952;font-size:16px;padding:2px 8px 0}
.pill{background:rgba(255,253,248,.8);border:1px solid var(--line);padding:8px 11px;border-radius:999px;min-width:104px;text-align:center}
.pill b{font-size:18px}
.notice{min-height:20px;text-align:center;font-size:14px;color:#756c63}
.key-hint{text-align:center;font-size:12px;color:#948b82;padding-bottom:2px}
.overlay{position:fixed;inset:0;background:rgba(35,29,24,.52);display:none;align-items:center;justify-content:center;z-index:40;padding:16px;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.panel{width:min(800px,100%);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(24,18,14,.25);padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel h2{margin:0;font-size:26px}
.close-btn{border:none;background:#eee5d8;color:#493f36;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}
.panel-layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.panel-art{display:flex;align-items:center;justify-content:center;min-height:220px;border-radius:18px;background:#fbf5eb;border:1px solid #eadfce;padding:8px;overflow:hidden}
.panel-art img{width:100%;height:auto;max-height:300px;object-fit:contain;display:block}
.panel-content{min-width:0}
.history-meta{color:var(--muted);line-height:1.6;font-size:15px;margin-bottom:12px}
.history-grid{display:flex;flex-wrap:wrap;gap:9px}
.history-chip{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:48px;border-radius:13px;background:#edf5fc;color:#1767aa;border:1px solid #d5e7f5;font-size:22px;font-weight:900}
.history-chip.latest{background:#def3df;color:#2f7c3a;border-color:#c1e3c4}
.empty{padding:25px 0;text-align:center;color:#776f67;font-size:17px}
.current-setting{background:#f8f3eb;border:1px solid #eadfce;border-radius:15px;padding:12px 14px;line-height:1.65;color:#645c54;margin-bottom:14px}
.field{margin:15px 0}
.field label{display:block;font-weight:900;font-size:17px;margin-bottom:8px}
.number-row{display:flex;gap:8px;align-items:center}
.step-btn{width:50px;height:48px;border:none;border-radius:12px;background:#eee4d6;color:#4d443c;font-size:26px;font-weight:900;cursor:pointer}
input{width:100%;border:1px solid #d8c9b7;background:#fffefb;border-radius:13px;padding:12px 13px;font-size:18px;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,134,216,.13)}
.help{font-size:13px;color:#7d746b;line-height:1.55;margin-top:6px}
.apply-btn{width:100%;border:none;border-radius:14px;background:linear-gradient(180deg,#58b963,#3c9046);color:#fff;padding:14px;font-size:19px;font-weight:900;cursor:pointer;margin-top:5px}
.finish-panel{text-align:center;width:min(620px,100%)}
.finish-art{background:#fbf5eb;border:1px solid #eadfce;border-radius:18px;padding:8px;margin-bottom:8px}
.finish-art img{max-width:100%;max-height:330px;display:block;margin:auto;object-fit:contain}
.finish-panel h2{font-size:30px;margin:12px 0 7px}
.finish-panel p{color:#6f665e;line-height:1.65;margin:0 0 15px}
.finish-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.finish-actions button{border:none;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer}
.finish-actions .secondary{background:#eee5d8;color:#4c433b}
.finish-actions .primary{background:var(--green);color:#fff}
body.classroom{padding:6px;background:#fff9ef}
body.classroom .app{width:min(1180px,100%);min-height:calc(100vh - 12px);gap:6px}
body.classroom .header{min-height:42px}
body.classroom .subtitle,body.classroom .key-hint{display:none}
body.classroom .stage{min-height:calc(100vh - 200px);border-radius:20px;padding:8px}
body.classroom .result-zone{min-height:calc(100vh - 220px);width:min(620px,60vw)}
body.classroom #result{font-size:clamp(240px,42vw,520px)}
body.classroom .main-art{inset:0}
body.classroom .actions{grid-template-columns:repeat(4,1fr)}
body.classroom .action-btn{padding:11px 8px;font-size:15px}
body.classroom #draw{padding:14px;font-size:26px}
body.classroom .status-row{font-size:14px}
body.drawing-now .header-actions,body.drawing-now .actions{opacity:.32;pointer-events:none}
@media(max-width:720px){
  body{padding:9px}
  .app{min-height:calc(100vh - 18px)}
  .header{align-items:flex-start}
  h1{white-space:normal;font-size:24px}
  .subtitle{display:none}
  .header-actions .mini-btn:not(#fullscreenBtn){display:none}
  .stage{min-height:410px;padding:8px}
  .main-art{inset:10px -4px 0}
  .result-zone{width:58vw;min-height:270px;padding:8px}
  #result{font-size:clamp(120px,35vw,220px)}
  .result-kicker{font-size:14px}
  .result-note{font-size:14px}
  .draw-art{width:35%;right:4px}
  .result-reaction{width:82px;right:1%;bottom:1%}
  .actions{grid-template-columns:1fr 1fr}
  .action-btn{font-size:16px;padding:13px 8px}
  .panel-layout{grid-template-columns:1fr}
  .panel-art{min-height:140px;max-height:210px}
  .panel-art img{max-height:190px;width:auto;max-width:100%}
}
@media(max-width:430px){
  .logo-dot{display:none}
  .stage{min-height:365px}
  .result-zone{width:56vw;min-height:245px}
  #result{font-size:clamp(105px,34vw,180px)}
  .status-row{gap:5px;font-size:13px}
  .pill{min-width:92px;padding:7px 8px}
  .pill b{font-size:16px}
  #draw{font-size:24px;padding:17px}
}

/* ===== 稳定修正版：仅调整主画面布局，不改原有功能脚本 ===== */
.left-art,.right-art{
  position:absolute;
  bottom:22px;
  pointer-events:none;
  z-index:1;
  transition:opacity .18s ease,transform .18s ease;
}
.left-art{left:38px;width:min(31%,315px)}
.right-art{right:46px;width:min(20%,205px)}
.left-art img,.right-art img{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 9px 10px rgba(59,39,22,.07));
}
.stage{min-height:500px;padding:20px 16px 24px}
.result-zone{
  z-index:3;
  width:min(390px,41vw);
  min-height:310px;
  padding:10px 8px;
}
#result{
  font-size:clamp(118px,18vw,230px);
  max-width:100%;
  letter-spacing:-.055em;
}
.result-kicker{font-size:16px}
.result-note{font-size:16px;margin-top:7px}
/* 抽签中：动作图只作为低调的动态陪衬，不再挤在右下角 */
.draw-art{
  left:50%;right:auto;bottom:16px;
  width:min(210px,24%);
  opacity:0;
  transform:translateX(-50%) translateY(12px) scale(.96);
  z-index:2;
}
body.drawing-now .draw-art{
  opacity:.34;
  transform:translateX(-50%) translateY(0) scale(1);
}
body.drawing-now .left-art,body.drawing-now .right-art{opacity:.48}
/* 原先右下角的反应贴图会让画面显得重复，保留 DOM 供脚本调用但视觉隐藏 */
.result-reaction{display:none!important}
body.classroom .left-art{left:24px;width:min(30%,350px)}
body.classroom .right-art{right:28px;width:min(18%,220px)}
body.classroom .result-zone{width:min(470px,42vw)}
body.classroom #result{font-size:clamp(190px,30vw,380px)}
@media(max-width:720px){
  .stage{min-height:410px}
  .left-art{left:8px;bottom:15px;width:34%}
  .right-art{right:8px;bottom:15px;width:22%}
  .result-zone{width:41vw;min-height:255px;padding:6px 2px}
  #result{font-size:clamp(88px,22vw,155px)}
  .result-kicker{font-size:13px}
  .result-note{font-size:13px;padding:3px 8px}
  .draw-art{width:29%;bottom:12px}
}
@media(max-width:430px){
  .left-art{left:4px;width:35%}
  .right-art{right:4px;width:23%}
  .result-zone{width:40vw}
  #result{font-size:clamp(78px,21vw,132px)}
}

</style>
</head>

    <h2>全部号码都抽完啦！</h2>
    <p id="finishText">这一轮已经顺利完成。</p>
    <div class="finish-actions">
      <button class="secondary" onclick="closeOverlay('finishOverlay');showHistory()">查看记录</button>
      <button class="primary" onclick="restartFromFinish()">重新开始</button>
    </div>
  </div>
</div>

<script>
let numbers=[];
let history=[];
let drawing=false;
let maxNumber=42;
let excludedNumbers=[];
let noticeTimer=null;
let reactionTimer=null;

function setResult(value){
  const el=document.getElementById('result');
  el.textContent=value;
  el.classList.toggle('empty-result',value==='?');
}

function buildPool(){
  const excluded=new Set(excludedNumbers);
  numbers=[];
  for(let i=1;i<=maxNumber;i++) if(!excluded.has(i)) numbers.push(i);
  history=[];
  setResult('?');
  document.getElementById('lastInfo').textContent='点击下方按钮开始抽签';
  updateUI();
}

function draw(){
  if(drawing) return;
  if(numbers.length===0){ showFinishOverlay(); return; }

  drawing=true;
  document.body.classList.add('drawing-now');
  document.getElementById('lastInfo').textContent='Jerry 正在抽号码…';
  updateButtons();
  hideReaction();
  let count=0;
  const result=document.getElementById('result');

  const animation=setInterval(()=>{
    const temp=numbers[Math.floor(Math.random()*numbers.length)];
    setResult(temp);
    count++;
    if(count>=25){
      clearInterval(animation);
      const index=Math.floor(Math.random()*numbers.length);
      const number=numbers.splice(index,1)[0];
      history.push(number);
      setResult(number);
      result.classList.remove('pop');
      void result.offsetWidth;
      result.classList.add('pop');
      document.getElementById('lastInfo').textContent='就是 '+number+' 号！';
      drawing=false;
      document.body.classList.remove('drawing-now');
      showReaction();
      updateUI();
      if(numbers.length===0) setTimeout(showFinishOverlay,650);
    }
  },60);
}

function undoLast(){
  if(drawing) return;
  if(history.length===0){ flashNotice('还没有可以撤回的号码'); return; }
  const undone=history.pop();
  numbers.push(undone);
  numbers.sort((a,b)=>a-b);
  setResult(history.length?history[history.length-1]:'?');
  document.getElementById('lastInfo').textContent=history.length?'回到上一笔：'+history[history.length-1]+' 号':'已撤回，等待重新抽签';
  updateUI();
  flashNotice('已撤回 '+undone+' 号，并放回号码池');
}

function resetDraw(force=false){
  if(drawing) return;
  if(!force && history.length>0 && !confirm('确定要重新开始吗？\n本轮已抽取 '+history.length+' 个号码，记录会被清空。')) return;
  closeOverlay('finishOverlay');
  buildPool();
  flashNotice('已重新开始');
}

function restartFromFinish(){
  closeOverlay('finishOverlay');
  resetDraw(true);
}

function showReaction(){
  clearTimeout(reactionTimer);
  const el=document.getElementById('resultReaction');
  el.classList.add('show');
  reactionTimer=setTimeout(()=>el.classList.remove('show'),1700);
}
function hideReaction(){ document.getElementById('resultReaction').classList.remove('show'); }

function showHistory(){
  renderHistory();
  document.getElementById('historyOverlay').classList.add('show');
}
function renderHistory(){
  const box=document.getElementById('historyContent');
  if(history.length===0){
    box.innerHTML='<div class="empty">还没有抽签记录</div><div class="history-meta">先抽一个号码，记录就会出现在这里。</div>';
    return;
  }
  box.innerHTML='<div class="history-meta">本轮已抽 <b>'+history.length+'</b> 个号码。绿色为最新一个。</div><div class="history-grid">'+history.map((n,i)=>'<span class="history-chip '+(i===history.length-1?'latest':'')+'">'+n+'</span>').join('')+'</div>';
}

function showSettings(){
  document.getElementById('maxNumber').value=maxNumber;
  document.getElementById('excludeInput').value=excludedNumbers.join('、');
  renderCurrentSetting();
  document.getElementById('settingsOverlay').classList.add('show');
}
function renderCurrentSetting(){
  const usable=maxNumber-excludedNumbers.length;
  document.getElementById('currentSetting').innerHTML='当前范围：<b>1～'+maxNumber+'</b><br>排除：<b>'+(excludedNumbers.length?excludedNumbers.join('、'):'无')+'</b><br>本轮可抽：<b>'+usable+' 个号码</b>';
}
function changeMax(delta){
  const input=document.getElementById('maxNumber');
  let value=parseInt(input.value,10)||1;
  input.value=Math.min(999,Math.max(1,value+delta));
}
function parseExcluded(text,max){
  if(!text.trim()) return {values:[],invalid:[]};
  const normalized=text.replace(/[，、;；\s]+/g,',').replace(/－|—|–|~/g,'-');
  const result=new Set(),invalid=[];
  for(const raw of normalized.split(',').filter(Boolean)){
    const part=raw.trim();
    if(/^\d+$/.test(part)){
      const n=parseInt(part,10);
      if(n>=1&&n<=max) result.add(n); else invalid.push(part);
      continue;
    }
    const m=part.match(/^(\d+)-(\d+)$/);
    if(m){
      let a=parseInt(m[1],10),b=parseInt(m[2],10);
      if(a>b)[a,b]=[b,a];
      if(a<1||b>max){invalid.push(part);continue;}
      for(let n=a;n<=b;n++)result.add(n);
      continue;
    }
    invalid.push(part);
  }
  return {values:[...result].sort((a,b)=>a-b),invalid};
}
function applySettings(){
  if(drawing)return;
  const newMax=parseInt(document.getElementById('maxNumber').value,10);
  if(!Number.isInteger(newMax)||newMax<1||newMax>999){alert('号码上限请输入 1～999 之间的整数。');return;}
  const parsed=parseExcluded(document.getElementById('excludeInput').value,newMax);
  if(parsed.invalid.length){alert('这些排除号码无法识别或超出范围：\n'+parsed.invalid.join('、'));return;}
  if(parsed.values.length>=newMax){alert('不能把所有号码都排除，请至少保留 1 个可抽号码。');return;}
  if(history.length>0&&!confirm('应用新设置会清空当前抽签记录并重新开始，确定吗？'))return;
  maxNumber=newMax;
  excludedNumbers=parsed.values;
  buildPool();
  closeOverlay('settingsOverlay');
  flashNotice('设置已应用，共 '+numbers.length+' 个可抽号码');
}

function updateUI(){
  document.getElementById('remainingCount').textContent=numbers.length;
  document.getElementById('drawnCount').textContent=history.length;
  document.getElementById('excludedCount').textContent=excludedNumbers.length;
  updateButtons();
  if(document.getElementById('historyOverlay').classList.contains('show'))renderHistory();
  if(document.getElementById('settingsOverlay').classList.contains('show'))renderCurrentSetting();
}
function updateButtons(){
  document.getElementById('draw').disabled=drawing||numbers.length===0;
  document.getElementById('undo').disabled=drawing||history.length===0;
  document.getElementById('historyBtn').disabled=drawing;
  document.getElementById('settingsBtn').disabled=drawing;
  document.getElementById('reset').disabled=drawing;
}
function flashNotice(text){
  const el=document.getElementById('notice');
  clearTimeout(noticeTimer);
  el.textContent=text;
  noticeTimer=setTimeout(()=>el.textContent='',2400);
}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}
function overlayClick(event,id){if(event.target.id===id)closeOverlay(id)}
function showFinishOverlay(){
  const total=maxNumber-excludedNumbers.length;
  document.getElementById('finishText').textContent='这一轮共抽出了 '+history.length+' 个号码，可抽总数 '+total+' 个。Tom 可以休息一下了。';
  document.getElementById('finishOverlay').classList.add('show');
}

async function toggleClassroomMode(){
  const body=document.body,btn=document.getElementById('fullscreenBtn');
  try{
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
      body.classList.add('classroom');btn.textContent='✕ 退出课堂模式';
    }else{
      if(document.exitFullscreen)await document.exitFullscreen();
      body.classList.remove('classroom');btn.textContent='⛶ 课堂模式';
    }
  }catch(e){
    body.classList.toggle('classroom');btn.textContent=body.classList.contains('classroom')?'✕ 退出课堂模式':'⛶ 课堂模式';
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement){document.body.classList.remove('classroom');document.getElementById('fullscreenBtn').textContent='⛶ 课堂模式';}
});
document.addEventListener('keydown',(e)=>{
  const overlay=document.querySelector('.overlay.show');
  const tag=document.activeElement?.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA';
  if(e.key==='Escape'&&overlay){overlay.classList.remove('show');return;}
  if(typing)return;
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();draw();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoLast();}
  else if(e.key.toLowerCase()==='h')showHistory();
  else if(e.key.toLowerCase()==='f')toggleClassroomMode();
});

buildPool();
</script>
</body>
</html>
