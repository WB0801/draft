<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抽签器</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#result{
    font-size:35vw;
    font-weight:bold;
    color:#2196F3;
    margin-bottom:50px;
    line-height:1;
}

button{
    width:85%;
    max-width:400px;
    padding:20px;
    margin:10px 0;
    font-size:28px;
    border:none;
    border-radius:15px;
    color:white;
    cursor:pointer;
}

#draw{
    background:#4CAF50;
}

#reset{
    background:#F44336;
}

#remaining{
    margin-top:30px;
    font-size:24px;
    color:#555;
}
</style>

</head>
<body>

<div id="result">?</div>

<button id="draw" onclick="draw()">🎲 抽一个</button>

<button id="reset" onclick="resetDraw()">🔄 重新开始</button>

<div id="remaining"></div>

<script>
let numbers=[];

function resetDraw(){
    numbers=[];
    for(let i=1;i<=42;i++) numbers.push(i);

    document.getElementById("result").textContent="?";
    updateRemaining();
}

function draw(){

    if(numbers.length===0){
        alert("全部号码都抽完了！");
        return;
    }

    const index=Math.floor(Math.random()*numbers.length);
    const number=numbers.splice(index,1)[0];

    document.getElementById("result").textContent=number;
    updateRemaining();
}

function updateRemaining(){
    document.getElementById("remaining").textContent=
    "剩余：" + numbers.length;
}

resetDraw();
</script>

</body>
</html>
