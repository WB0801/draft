<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抽签器</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#result{
    font-size:35vw;
    font-weight:bold;
    color:#2196F3;
    margin-bottom:50px;
    line-height:1;
}

.pop{
    animation:pop 0.3s;
}

@keyframes pop{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.3);
    }
    100%{
        transform:scale(1);
    }
}

button{
    width:85%;
    max-width:400px;
    padding:20px;
    margin:8px 0;
    font-size:28px;
    border:none;
    border-radius:15px;
    color:white;
    cursor:pointer;
}

button:disabled{
    opacity:0.5;
}

#draw{
    background:#4CAF50;
}

#reset{
    background:#F44336;
}

#historyBtn{
    background:#2196F3;
}

#remaining{
    margin-top:25px;
    font-size:24px;
    color:#555;
}
</style>

</head>

<body>

<div id="result">?</div>

<button id="draw" onclick="draw()">🎲 抽一个</button>

<button id="reset" onclick="resetDraw()">🔄 重新开始</button>

<button id="historyBtn" onclick="showHistory()">📜 查看记录</button>

<div id="remaining"></div>


<script>

let numbers=[];
let history=[];
let drawing=false;


// 初始化
function resetDraw(){

    numbers=[];
    history=[];

    for(let i=1;i<=42;i++){
        numbers.push(i);
    }

    document.getElementById("result").textContent="?";

    updateRemaining();
}


// 抽签
function draw(){

    if(drawing) return;

    if(numbers.length===0){
        alert("全部号码都抽完了！");
        return;
    }


    drawing=true;

    const result=document.getElementById("result");

    let count=0;


    const animation=setInterval(()=>{

        const temp=Math.floor(Math.random()*42)+1;

        result.textContent=temp;

        count++;


        if(count>=25){

            clearInterval(animation);


            // 从剩余号码中抽一个
            const index=Math.floor(Math.random()*numbers.length);

            const number=numbers.splice(index,1)[0];


            result.textContent=number;


            // 加入历史记录
            history.push(number);


            // 放大动画
            result.classList.remove("pop");

            void result.offsetWidth;

            result.classList.add("pop");


            updateRemaining();


            drawing=false;
        }


    },60);

}


// 显示历史记录
function showHistory(){

    if(history.length===0){

        alert("还没有抽签记录");

        return;
    }


    alert(
        "抽签记录：\n\n" +
        history.join("、")
    );
}


// 更新剩余数量
function updateRemaining(){

    document.getElementById("remaining").textContent =
    "剩余：" + numbers.length;

}


resetDraw();

</script>

</body>
</html>
